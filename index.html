<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0E">
  <meta name="description" content="Find something worth watching.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://image.tmdb.org https://www.themoviedb.org data: blob:; connect-src 'self' https://api.themoviedb.org https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,'IBM Plex Sans Arabic',sans-serif;background:#0B0B0E;color:#F2F2F5}
    *,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}
    :focus-visible{outline:2px solid #F2B84B;outline-offset:3px}a{color:inherit;text-decoration:none}
    .skip-link{position:absolute;inset-block-start:-100px;inset-inline-start:12px;z-index:200;padding:12px;background:#F2B84B;color:#0B0B0E}.skip-link:focus{inset-block-start:12px}
    #app{min-height:100dvh}#live-region{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skipContent">Skip to content</a>
  <div id="app"></div><div id="live-region" role="status" aria-live="polite" aria-atomic="true"></div><div id="overlay-root"></div><div id="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/router.js"></script>
</body>
</html>
